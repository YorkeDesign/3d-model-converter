# PROJECT.yml - how this project tells Harvestry what it is.
#
# Harvestry syncs this file from GitHub daily (05:30 UTC) and feeds it to the
# project alignment agent, the relevance gate and the Curator. Without it, the
# vault scores this project against a paragraph generated from the README -
# which describes only the code, so every project reads as a software project.
#
# Template + field reference: ~/.claude/templates/PROJECT.yml
# To author or review this file properly: run /write-project-profile


name: 3d-model-converter
harvestry_project: 3d-model-converter
stage: beta

# What this project IS. Decides whether physical signal is core or a tangent.
nature:
  - "web"
  - "software"

mission: >
  Browser-local USDZ and GLB converter and preview tool built on Three.js:
  drag-and-drop upload, real-time 3D preview, per-axis rotation and position
  controls, transform baking, and optimised export with vertex deduplication.
  Runs entirely client-side, with no uploads.

# Categories this project is actively hunting. A high interest scores 7+.
signal_interests:
  - label: "glTF, GLB and USDZ format details, tooling and converters"
    weight: high
  - label: "Three.js rendering and geometry utilities"
    weight: high
  - label: "Client-side 3D processing: WASM, mesh optimisation, compression"
    weight: high
  - label: "AR asset requirements for iOS Quick Look and Android Scene Viewer"
    weight: high
  - label: "Draco, Meshopt and texture compression"
    weight: medium
  - label: "Browser file handling for large binary assets"
    weight: medium

# Live questions the OUTSIDE WORLD could help answer. An item that informs one
# scores 8+. Move these in the SAME COMMIT as the decision; when one closes, set
# `status: closed` and add `rests_on` naming the facts it depends on, rather
# than deleting it.
open_decisions:
  - id: threejs-dev-branch-pin
    question: >
      Can this tool move off the Three.js dev branch onto a tagged release yet,
      or does USDZ loading still depend on unreleased USDLoader work?
    status: open
    notes: >
      The CDN pins mrdoob/three.js@dev because the USDLoader rewrite and its
      pure-JavaScript USDC binary Crate parser landed in PR #32704 targeting
      r183; stable Three.js reads only USDA, which most real-world USDZ files
      are not. A dev pin means an upstream commit can break loading with no
      warning. A release announcement naming USDLoader or USDC, a changelog
      entry, or a regression report against r183+ moves this. An r186
      announcement is already sitting unassessed in this project's queue.

  - id: usdc-binary-export
    question: >
      Is there a browser-viable way to write binary USDC, or is the 2-5x size
      bloat on every exported USDZ permanent?
    status: open
    notes: >
      Three.js USDZExporter emits USDA ASCII (~8-10 bytes per float against 4
      binary) and the USDZ spec mandates zero ZIP compression, so exported USDZ
      runs 2-5x the size of the input while GLB stays near parity. Hand-writing
      a USDC encoder was judged out of scope. A WASM build of OpenUSD small
      enough to load in a page, a JavaScript Crate writer, or a USDZExporter
      change upstream reopens it.

  - id: mesh-compression-stage
    question: >
      Should GLB export add a Draco or Meshopt stage, and do compressed meshes
      still open in iOS Quick Look and Android Scene Viewer?
    status: open
    notes: >
      mergeVertices is currently the only size reduction (~80% vertex cut, 26 MB
      down to 5.4 MB on the reference model). Three.js GLTFExporter cannot emit
      Draco or Meshopt; gltf-transform could, but would be this project's first
      runtime dependency beyond Three.js, so it is proposed behind a default-off
      checkbox. Viewer compatibility is what decides it: a support matrix, a
      Quick Look or Scene Viewer release note, or a real compression-ratio
      benchmark on scanned meshes moves this.

  - id: usdz-texture-fidelity
    question: >
      Does USDLoader carry USDZ textures through to GLB export reliably, or is a
      custom archive-extraction path still required?
    status: open
    notes: >
      An early manual path (extractImagesFromUSDZ, scanForEmbeddedImages,
      applyFallbackTextures) was abandoned as legacy once the displayColor
      monkey-patch landed, but textures remain a known silent-drop hazard on
      export and per-vertex colour is the only channel actually verified
      end-to-end. An upstream USDLoader texture fix, a reproducible issue, or
      another browser USDZ implementation that handles it moves this.

# Explicit negatives. Scored 0-2 however well they otherwise match.
not_interested:
  - "3D modelling tutorials"
  - "Cloud asset conversion services"

keywords:
  - "usdz"
  - "glb"
  - "gltf"
  - "threejs"
  - "quicklook"
